  <style>

      background: rgba(15, 15, 15, 0.94);

    .search-button {

    /* =====================================================

        grid-template-columns:

    /* =====================================================
       CARD
    ====================================================== */

    .card {

      position: relative;

      background: #161616;

      border-radius: 10px;

      overflow: hidden;

      cursor: pointer;

      border: 1px solid #222222;

      /*
        Browser tidak perlu merender seluruh
        isi card yang jauh dari viewport.
      */

      content-visibility: auto;

      contain-intrinsic-size:
        300px 210px;

      /*
        Mengurangi repaint.
      */

      contain: layout paint style;

      transform: translateZ(0);

      transition:

    .card:active {

      transform: scale(.97);
    }


    /* =====================================================
       VIDEO CONTAINER
    ====================================================== */

    .video-container {

      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #222222;

      contain: layout paint;
    }


    .video-container.portrait {

      aspect-ratio: 9 / 16;

    /* =====================================================
       SHIMMER LOADING
    ====================================================== */

    .loading-shimmer {

      background:
        linear-gradient(
          90deg,
          #161616 25%,
          #242424 50%,
          #161616 75%
        );

      background-size: 200% 100%;

      animation:
        shimmer 1.4s infinite;
    }


    @keyframes shimmer {

      0% {

        background-position:
          200% 0;
      }

      100% {

        background-position:

      }

    /* =====================================================

    video.thumbnail-preview {

    video.thumbnail-preview.loaded {

    /* =====================================================

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =====================================================
       KONFIGURASI
    ====================================================== */

    /*
      30 video setiap halaman.

      Jika layar desktop mempunyai 4 kolom,
      maka kira-kira 7-8 baris per halaman.

      Jika 3 kolom:
      sekitar 10 baris.

      Jika 2 kolom:
      sekitar 15 baris.
    */

    const ITEMS_PER_PAGE = 30;


    /*
      Render dilakukan 10 kartu setiap batch.

      Tujuannya agar browser tidak freeze
      ketika pindah halaman.
    */

    const RENDER_BATCH_SIZE = 10;


    /*
      Video mulai diload ketika mendekati viewport.
    */

    const LAZY_ROOT_MARGIN =
      "250px 0px";


    /*
      Video yang benar-benar jauh dari viewport
      dapat dilepas dari buffer.
    */

    const UNLOAD_ROOT_MARGIN =
      "900px 0px";


    /* =====================================================
       STATE
    ====================================================== */

    let rawVideos = [];

    let filteredVideos = [];


    /*
      Ambil halaman terakhir dari session.
    */

    let currentPage =
      parseInt(
        sessionStorage.getItem(
          "sv_page"
        ),
        10
      ) || 1;


    /*
      Ambil filter terakhir.
    */

    let currentFilter =
      sessionStorage.getItem(
        "sv_filter"
      ) || "latest";


    /*
      Token untuk membatalkan proses
      render halaman sebelumnya.
    */

    let renderToken = 0;


    /*
      Cache data halaman.

      Contoh:

      page 1 -> 30 data
      page 2 -> 30 data
      page 3 -> 30 data
    */

    const pageCache =
      new Map();


    /*
      Cache pencarian.
    */

    const searchCache =
      new Map();


    /*
      Promise fetch videos.json.

      Hanya boleh ada satu request.
    */

    let videosPromise = null;


    /* =====================================================
       DOM
    ====================================================== */

    const mainFeed =
      document.getElementById(
        "mainFeed"
      );


    const pagination =
      document.getElementById(
        "pagination"
      );


    const searchBox =
      document.getElementById(
        "searchBox"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    /* =====================================================
       VIDEO LAZY LOAD OBSERVER
    ====================================================== */

    const videoObserver =
      new IntersectionObserver(
        function(entries, observer) {

          entries.forEach(
            function(entry) {

              if (
                !entry.isIntersecting
              ) {

                return;

              }


              const video =
                entry.target;


              /*
                Load video hanya jika
                belum dimuat.
              */

              if (
                video.dataset.loaded !==
                "true"
              ) {

                loadVideo(
                  video
                );

              }


              /*
                Tidak perlu terus
                mengawasi setelah
                berhasil masuk viewport.
              */

              observer.unobserve(
                video
              );

            }
          );

        },
        {
          rootMargin:
            LAZY_ROOT_MARGIN,

          threshold: 0
        }
      );


    /* =====================================================
       VIDEO UNLOAD OBSERVER
    ====================================================== */

    const unloadObserver =
      new IntersectionObserver(
        function(entries) {

          entries.forEach(
            function(entry) {

              if (
                entry.isIntersecting
              ) {

                return;

              }


              const video =
                entry.target;


              /*
                Belum loaded -> tidak perlu unload.
              */

              if (
                video.dataset.loaded !==
                "true"
              ) {

                return;

              }


              const rect =
                video.getBoundingClientRect();


              /*
                Benar-benar jauh
                dari viewport.
              */

              const farAbove =
                rect.bottom <
                -900;


              const farBelow =
                rect.top >
                window.innerHeight +
                900;


              if (
                farAbove ||
                farBelow
              ) {

                unloadVideo(
                  video
                );

              }

            }
          );

        },
        {
          rootMargin:
            UNLOAD_ROOT_MARGIN,

          threshold: 0
        }
      );


    /* =====================================================
       LOAD VIDEO
    ====================================================== */

    function loadVideo(video) {

      if (
        !video
      ) {

        return;

      }


      /*
        Jangan load dua kali.
      */

      if (
        video.dataset.loaded ===
        "true"
      ) {

        return;

      }


      if (
        video.dataset.loading ===
        "true"
      ) {

        return;

      }


      const source =
        video.querySelector(
          "source"
        );


      if (
        !source
      ) {

        return;

      }


      const url =
        source.dataset.src;


      if (
        !url
      ) {

        return;

      }


      /*
        Tandai loading.
      */

      video.dataset.loading =
        "true";


      /*
        Metadata saja.

        Browser tidak diminta
        download seluruh video.
      */

      video.preload =
        "metadata";


      /*
        Masukkan URL asli.
      */

      source.src =
        url;


      /*
        Mulai proses metadata.
      */

      video.load();

    }


    /* =====================================================
       UNLOAD VIDEO
    ====================================================== */

    function unloadVideo(video) {

      if (
        !video
      ) {

        return;

      }


      const rect =
        video.getBoundingClientRect();


      /*
        Jangan unload yang masih
        dekat dengan viewport.
      */

      const stillNear =
        rect.bottom >
        -500 &&
        rect.top <
        window.innerHeight +
        500;


      if (
        stillNear
      ) {

        return;

      }


      const source =
        video.querySelector(
          "source"
        );


      if (
        !source
      ) {

        return;

      }


      try {

        video.pause();

      } catch (e) {}


      /*
        Lepaskan resource media.
      */

      source.removeAttribute(
        "src"
      );


      try {

        video.load();

      } catch (e) {}


      /*
        Reset status.
      */

      video.dataset.loaded =
        "false";


      video.dataset.loading =
        "false";


      video.classList.remove(
        "loaded"
      );


      const container =
        video.parentElement;


      if (
        container
      ) {

        container.classList.add(
          "loading-shimmer"
        );

      }


      /*
        Video akan load kembali
        jika user scroll mendekatinya.
      */

      videoObserver.observe(
        video
      );

    }


    /* =====================================================
       VIDEO EVENTS
    ====================================================== */

    function setupVideo(
      video
    ) {

      /*
        Metadata berhasil.
      */

      video.addEventListener(
        "loadedmetadata",
        function() {

          video.dataset.loaded =
            "true";


          video.dataset.loading =
            "false";


          video.classList.add(
            "loaded"
          );


          const container =
            video.parentElement;


          if (
            container
          ) {

            container.classList.remove(
              "loading-shimmer"
            );

          }


          /*
            Deteksi portrait.

            Landscape:
            16:9

            Portrait:
            9:16
          */

          if (
            this.videoWidth > 0 &&
            this.videoHeight > 0
          ) {

            const ratio =
              this.videoWidth /
              this.videoHeight;


            if (
              ratio < 1
            ) {

              if (
                container
              ) {

                container.classList.add(
                  "portrait"
                );

              }

            }

          }

        },
        {
          passive: true
        }
      );


      /*
        Error handler.
      */

      video.addEventListener(
        "error",
        function() {

          video.dataset.loaded =
            "false";


          video.dataset.loading =
            "false";

        },
        {
          passive: true
        }
      );

    }


    /* =====================================================
       CREATE VIDEO CARD
    ====================================================== */

    function createCard(
      videoData
    ) {

      /*
        CARD
      */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      /*
        VIDEO CONTAINER
      */

      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video-container loading-shimmer";


      /*
        VIDEO
      */

      const video =
        document.createElement(
          "video"
        );


      video.className =
        "thumbnail-preview";


      video.muted =
        true;


      video.playsInline =
        true;


      /*
        Sangat penting:

        jangan preload semua video.
      */

      video.preload =
        "none";


      video.dataset.loaded =
        "false";


      video.dataset.loading =
        "false";


      /*
        SOURCE

        URL tidak diletakkan langsung
        pada src.

        URL disimpan di data-src.

        Jadi browser belum meminta
        file video.
      */

      const source =
        document.createElement(
          "source"
        );


      source.dataset.src =
        String(
          videoData.Url || ""
        ) + "#t=0.5";


      source.type =
        "video/mp4";


      video.appendChild(
        source
      );


      videoContainer.appendChild(
        video
      );


      /*
        CARD INFO
      */

      const cardInfo =
        document.createElement(
          "div"
        );


      cardInfo.className =
        "card-info";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "card-title";


      /*
        textContent lebih aman
        daripada innerHTML.
      */

      title.textContent =
        videoData.Judul ||
        "Tanpa Judul";


      cardInfo.appendChild(
        title
      );


      /*
        GABUNGKAN
      */

      card.appendChild(
        videoContainer
      );


      card.appendChild(
        cardInfo
      );


      /*
        EVENT VIDEO
      */

      setupVideo(
        video
      );


      /*
        Lazy observer.
      */

      videoObserver.observe(
        video
      );


      /*
        Unload observer.
      */

      unloadObserver.observe(
        video
      );


      /*
        CARD CLICK
      */

      card.addEventListener(
        "click",
        function() {

          window.location.href =
            "detail.html?id=" +
            encodeURIComponent(
              videoData.id
            );

        }
      );


      return card;

    }


    /* =====================================================
       FETCH videos.json
    ====================================================== */

    function fetchVideos() {

      /*
        Jika request sedang berjalan,
        gunakan request yang sama.
      */

      if (
        videosPromise
      ) {

        return videosPromise;

      }


      videosPromise =
        fetch(
          "videos.json",
          {
            cache: "default"
          }
        )
        .then(
          function(response) {

            if (
              !response.ok
            ) {

              throw new Error(
                "HTTP " +
                response.status
              );

            }


            return response.json();

          }
        )
        .then(
          function(data) {

            if (
              !Array.isArray(data)
            ) {

              throw new Error(
                "videos.json harus berupa array"
              );

            }


            rawVideos =
              data;


            return data;

          }
        )
        .catch(
          function(error) {

            /*
              Jika gagal,
              boleh dicoba kembali.
            */

            videosPromise =
              null;


            throw error;

          }
        );


      return videosPromise;

    }


    /* =====================================================
       FILTER DATA
    ====================================================== */

    function applyFilterAndRender(
      resetPage = true
    ) {

      /*
        Kembali ke halaman 1
        jika filter berubah.
      */

      if (
        resetPage
      ) {

        currentPage =
          1;

      }


      /*
        Update tab.
      */

      document
        .querySelectorAll(
          ".tab-btn"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      const activeButton =
        document.getElementById(
          "btn-" +
          currentFilter
        );


      if (
        activeButton
      ) {

        activeButton.classList.add(
          "active"
        );

      }


      /*
        Simpan filter.
      */

      sessionStorage.setItem(
        "sv_filter",
        currentFilter
      );


      /*
        Buat array baru.

        latest:
        data paling belakang
        ditampilkan dahulu.

        all:
        urutan JSON asli.
      */

      if (
        currentFilter ===
        "latest"
      ) {

        filteredVideos =
          [...rawVideos].reverse();

      } else {

        filteredVideos =
          [...rawVideos];

      }


      /*
        Filter berubah,
        cache halaman harus dibersihkan.
      */

      pageCache.clear();


      /*
        Pastikan currentPage valid.
      */

      const totalPages =
        Math.max(
          1,
          Math.ceil(
            filteredVideos.length /
            ITEMS_PER_PAGE
          )
        );


      if (
        currentPage >
        totalPages
      ) {

        currentPage =
          totalPages;

      }


      /*
        Render.
      */

      renderPage(
        currentPage
      );

    }


    /* =====================================================
       GET PAGE DATA
    ====================================================== */

    function getPageData(
      page
    ) {

      /*
        Jika sudah ada cache,
        langsung gunakan.
      */

      if (
        pageCache.has(page)
      ) {

        return pageCache.get(
          page
        );

      }


      const start =
        (
          page - 1
        ) *
        ITEMS_PER_PAGE;


      const data =
        filteredVideos.slice(
          start,
          start +
          ITEMS_PER_PAGE
        );


      /*
        Simpan.
      */

      pageCache.set(
        page,
        data
      );


      return data;

    }


    /* =====================================================
       PREFETCH
    ====================================================== */

    function prefetchPage(
      page
    ) {

      /*
        Tidak ada halaman negatif.
      */

      if (
        page < 1
      ) {

        return;

      }


      const totalPages =
        Math.ceil(
          filteredVideos.length /
          ITEMS_PER_PAGE
        );


      /*
        Jangan prefetch di luar batas.
      */

      if (
        page >
        totalPages
      ) {

        return;

      }


      /*
        Sudah ada cache.
      */

      if (
        pageCache.has(page)
      ) {

        return;

      }


      /*
        Jalankan ketika browser
        sedang senggang.
      */

      const prepare =
        function() {

          getPageData(
            page
          );

        };


      if (
        "requestIdleCallback" in window
      ) {

        requestIdleCallback(
          prepare,
          {
            timeout: 500
          }
        );

      } else {

        setTimeout(
          prepare,
          50
        );

      }

    }


    /* =====================================================
       YIELD BROWSER
    ====================================================== */

    function yieldBrowser() {

      return new Promise(
        function(resolve) {

          /*
            requestAnimationFrame
            memberi kesempatan browser
            melakukan paint.
          */

          requestAnimationFrame(
            function() {

              requestAnimationFrame(
                function() {

                  resolve();

                }
              );

            }
          );

        }
      );

    }


    /* =====================================================
       CLEANUP PAGE LAMA
    ====================================================== */

    function cleanupCurrentVideos() {

      const videos =
        mainFeed.querySelectorAll(
          "video.thumbnail-preview"
        );


      videos.forEach(
        function(video) {

          try {

            videoObserver.unobserve(
              video
            );

          } catch (e) {}


          try {

            unloadObserver.unobserve(
              video
            );

          } catch (e) {}


          try {

            video.pause();

          } catch (e) {}

        }
      );

    }


    /* =====================================================
       RENDER PAGE
    ====================================================== */

    async function renderPage(
      page
    ) {

      /*
        Token baru.

        Jika user cepat menekan:
        1 -> 2 -> 3

        render halaman 1/2 yang belum selesai
        akan dibatalkan.
      */

      const token =
        ++renderToken;


      /*
        Validasi page.
      */

      page =
        Math.max(
          1,
          parseInt(
            page,
            10
          ) || 1
        );


      currentPage =
        page;


      /*
        Simpan halaman.
      */

      sessionStorage.setItem(
        "sv_page",
        String(page)
      );


      /*
        Bersihkan video halaman lama.
      */

      cleanupCurrentVideos();


      /*
        Kosongkan grid.
      */

      mainFeed.replaceChildren();


      /*
        Ambil data halaman.

        Kalau sudah diprefetch,
        data berasal dari cache.
      */

      const dataToShow =
        getPageData(
          page
        );


      /*
        Update pagination.
      */

      renderPagination();


      /*
        Tidak ada data.
      */

      if (
        dataToShow.length === 0
      ) {

        const message =
          document.createElement(
            "div"
          );


        message.className =
          "message";


        message.textContent =
          "Tidak ada video.";


        mainFeed.appendChild(
          message
        );


        return;

      }


      /*
        ====================================================
        RENDER BERTAHAP

        30 card:

        batch 1 = 10
        browser paint
        batch 2 = 10
        browser paint
        batch 3 = 10
        ====================================================
      */

      for (
        let i = 0;
        i < dataToShow.length;
        i += RENDER_BATCH_SIZE
      ) {

        /*
          Kalau user sudah pindah halaman,
          batalkan render ini.
        */

        if (
          token !==
          renderToken
        ) {

          return;

        }


        const fragment =
          document.createDocumentFragment();


        const end =
          Math.min(
            i +
            RENDER_BATCH_SIZE,
            dataToShow.length
          );


        for (
          let j = i;
          j < end;
          j++
        ) {

          const card =
            createCard(
              dataToShow[j]
            );


          fragment.appendChild(
            card
          );

        }


        mainFeed.appendChild(
          fragment
        );


        /*
          Beri browser kesempatan
          melakukan paint.
        */

        await yieldBrowser();

      }


      /*
        Jika render selesai,
        prefetch halaman berikutnya.
      */

      if (
        token ===
        renderToken
      ) {

        prefetchPage(
          page + 1
        );


        /*
          Halaman sebelumnya juga
          disiapkan jika user menekan
          tombol kembali.
        */

        prefetchPage(
          page - 1
        );

      }

    }


    /* =====================================================
       PAGINATION
    ====================================================== */

    function renderPagination() {

      pagination.replaceChildren();


      const totalPages =
        Math.ceil(
          filteredVideos.length /
          ITEMS_PER_PAGE
        );


      /*
        Kalau hanya satu halaman,
        pagination tidak ditampilkan.
      */

      if (
        totalPages <= 1
      ) {

        return;

      }


      const maxVisible =
        10;


      let startPage =
        Math.max(
          1,
          currentPage -
          Math.floor(
            maxVisible / 2
          )
        );


      let endPage =
        Math.min(
          totalPages,
          startPage +
          maxVisible -
          1
        );


      if (
        endPage -
        startPage +
        1 <
        maxVisible
      ) {

        startPage =
          Math.max(
            1,
            endPage -
            maxVisible +
            1
          );

      }


      /*
        PREVIOUS
      */

      if (
        currentPage > 1
      ) {

        pagination.appendChild(
          createPageButton(
            "❮",
            currentPage - 1
          )
        );

      }


      /*
        NOMOR HALAMAN
      */

      for (
        let i = startPage;
        i <= endPage;
        i++
      ) {

        pagination.appendChild(
          createPageButton(
            String(i),
            i,
            i === currentPage
          )
        );

      }


      /*
        NEXT
      */

      if (
        currentPage <
        totalPages
      ) {

        pagination.appendChild(
          createPageButton(
            "❯",
            currentPage + 1
          )
        );

      }

    }


    /* =====================================================
       CREATE PAGE BUTTON
    ====================================================== */

    function createPageButton(
      text,
      page,
      active = false
    ) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "page-btn";


      if (
        active
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        text;


      button.addEventListener(
        "click",
        function() {

          /*
            Kalau klik halaman
            yang sedang dibuka,
            tidak melakukan apa-apa.
          */

          if (
            page ===
            currentPage
          ) {

            return;

          }


          /*
            Render langsung.
          */

          renderPage(
            page
          );


          /*
            Kembali ke atas.
          */

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });


          /*
            Segera siapkan halaman
            setelah halaman yang diklik.
          */

          prefetchPage(
            page + 1
          );

        }
      );


      return button;

    }


    /* =====================================================
       FILTER BUTTON EVENT
    ====================================================== */

    document
      .querySelectorAll(
        ".tab-btn"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              currentFilter =
                this.dataset.filter;


              /*
                Reset search.
              */

              searchInput.value =
                "";


              /*
                Reset cache pencarian.
              */

              searchCache.clear();


              /*
                Terapkan filter.
              */

              applyFilterAndRender(
                true
              );

            }
          );

        }
      );


    /* =====================================================
       SEARCH TOGGLE
    ====================================================== */

    function toggleSearch() {

      const isOpen =
        searchBox.style.display ===
        "block";


      if (
        isOpen
      ) {

        searchBox.style.display =
          "none";

      } else {

        searchBox.style.display =
          "block";


        setTimeout(
          function() {

            searchInput.focus();

          },
          30
        );

      }

    }


    searchButton.addEventListener(
      "click",
      toggleSearch
    );


    searchButton.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          toggleSearch();

        }

      }
    );


    /* =====================================================
       SEARCH DEBOUNCE
    ====================================================== */

    let searchTimer =
      null;


    searchInput.addEventListener(
      "input",
      function() {

        clearTimeout(
          searchTimer
        );


        const value =
          this.value
            .trim()
            .toLowerCase();


        /*
          Tunggu 180ms.

          Jadi kalau user mengetik:

          a
          ab
          abc

          tidak langsung render 3 kali.
        */

        searchTimer =
          setTimeout(
            function() {

              performSearch(
                value
              );

            },
            180
          );

      }
    );


    /* =====================================================
       SEARCH
    ====================================================== */

    function performSearch(
      value
    ) {

      /*
        Search kosong.
      */

      if (
        !value
      ) {

        applyFilterAndRender(
          true
        );

        return;

      }


      /*
        Cek cache search.
      */

      if (
        searchCache.has(
          value
        )
      ) {

        filteredVideos =
          searchCache.get(
            value
          );


        pageCache.clear();


        renderPage(
          1
        );


        return;

      }


      /*
        Filter judul.
      */

      let result =
        rawVideos.filter(
          function(video) {

            const title =
              String(
                video.Judul || ""
              )
              .toLowerCase();


            return title.includes(
              value
            );

          }
        );


      /*
        Kalau filter latest,
        balik hasil search.
      */

      if (
        currentFilter ===
        "latest"
      ) {

        result =
          result.reverse();

      }


      /*
        Cache hasil search.
      */

      searchCache.set(
        value,
        result
      );


      filteredVideos =
        result;


      pageCache.clear();


      /*
        Render halaman pertama.
      */

      renderPage(
        1
      );

    }


    /* =====================================================
       INITIAL LOAD
    ====================================================== */

    fetchVideos()
      .then(
        function() {

          /*
            Pastikan filter valid.
          */

          if (
            currentFilter !==
            "latest" &&
            currentFilter !==
            "all"
          ) {

            currentFilter =
              "latest";

          }


          /*
            Terapkan filter
            dan halaman terakhir.
          */

          applyFilterAndRender(
            false
          );


          /*
            Prefetch halaman berikutnya
            setelah browser idle.
          */

          prefetchPage(
            currentPage + 1
          );

        }
      )
      .catch(
        function(error) {

          console.error(
            "Gagal memuat videos.json:",
            error
          );


          mainFeed.replaceChildren();


          const message =
            document.createElement(
              "div"
            );


          message.className =
            "message";


          message.textContent =
            "Gagal memuat videos.json.";


          mainFeed.appendChild(
            message
          );

        }
      );


    /* =====================================================
       PAGE HIDE CLEANUP
    ====================================================== */

    window.addEventListener(
      "pagehide",
      function() {

        cleanupCurrentVideos();

      }
    );


  </script>

</body>
