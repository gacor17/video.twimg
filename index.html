<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STREAMVID</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-MZYTMKBRT1"></script><script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments)}
gtag('js',new Date());
gtag('config','G-MZYTMKBRT1');
</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

.feed{
  width:100%;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scroll-behavior:auto;
  overscroll-behavior-y:contain;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{display:none}

.item{
  width:100%;
  height:100vh;
  height:100dvh;
  position:relative;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.info{
  position:absolute;
  left:15px;
  right:60px;
  bottom:25px;
  z-index:4;
  pointer-events:none;
  text-shadow:0 1px 5px #000;
}

.title{
  font-size:15px;
  font-weight:600;
  line-height:1.4;
}

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:14px 15px;
  pointer-events:none;
  background:linear-gradient(#000b,transparent);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:orange}

.loading{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:14px;
  z-index:3;
}

.empty{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}
</style></head><body><div class="top">
  <div class="logo">STREAM<span>VID</span></div>
</div><div class="feed" id="feed">
  <div class="empty">Memuat video...</div>
</div><script>
const feed=document.getElementById("feed");

let videos=[];
let active=null;
let currentIndex=-1;
let loading=new Set();

fetch("videos.json")
.then(r=>{
  if(!r.ok)throw Error();
  return r.json();
})
.then(data=>{
  videos=data.reverse();
  feed.innerHTML="";
  buildFeed();
})
.catch(()=>{
  feed.innerHTML='<div class="empty">Gagal memuat video</div>';
});


/* BUAT FEED */
function buildFeed(){

  const frag=document.createDocumentFragment();

  videos.forEach((v,i)=>{

    const item=document.createElement("section");
    item.className="item";
    item.dataset.index=i;

    item.innerHTML=`
      <div class="loading">
        <div class="spinner"></div>
      </div>

      <video
        muted
        playsinline
        loop
        preload="none">
      </video>

      <div class="info">
        <div class="title">${safe(v.Judul||"")}</div>
      </div>
    `;

    frag.appendChild(item);
  });

  feed.appendChild(frag);

  observe();
}


/* OBSERVER */
const observer=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

    const item=entry.target;
    const index=Number(item.dataset.index);
    const video=item.querySelector("video");

    if(entry.isIntersecting && entry.intersectionRatio>=0.65){

      activate(item,index,video);

      /* SIAPKAN VIDEO BERIKUTNYA */
      preload(index+1);

      /* SIAPKAN VIDEO SEBELUMNYA */
      preload(index-1);

    }else{

      video.pause();

      /*
       * Video yang sangat jauh dilepas
       * agar RAM tidak terus bertambah.
       */
      if(!entry.isIntersecting){

        const distance=Math.abs(index-currentIndex);

        if(distance>2){
          unload(video,item);
        }
      }
    }
  });

},{
  threshold:[0,.65,1]
});


function observe(){
  document.querySelectorAll(".item").forEach(item=>{
    observer.observe(item);
  });
}


/* AKTIFKAN VIDEO */
function activate(item,index,video){

  if(currentIndex===index && active===video){
    video.play().catch(()=>{});
    return;
  }

  if(active && active!==video){
    active.pause();
  }

  currentIndex=index;
  active=video;

  load(video,index,()=>{
    video.play().catch(()=>{});
  });
}


/* LOAD VIDEO */
function load(video,index,callback){

  if(index<0 || index>=videos.length)return;

  if(video.dataset.loaded==="1"){

    if(callback)callback();
    return;
  }

  if(loading.has(index)){

    video.addEventListener("canplay",()=>{
      if(callback)callback();
    },{once:true});

    return;
  }

  loading.add(index);

  video.src=videos[index].Url;
  video.dataset.loaded="1";

  video.addEventListener("loadeddata",()=>{

    loading.delete(index);

    const loader=video.parentElement.querySelector(".loading");

    if(loader)loader.style.display="none";

  },{once:true});

  video.addEventListener("error",()=>{

    loading.delete(index);

    const loader=video.parentElement.querySelector(".loading");

    if(loader)loader.innerHTML='<div class="error">Video gagal dimuat</div>';

  },{once:true});

  video.load();

  if(callback){

    if(video.readyState>=3){
      callback();
    }else{
      video.addEventListener("canplay",()=>{
        callback();
      },{once:true});
    }
  }
}


/* PRELOAD VIDEO TERDEKAT */
function preload(index){

  if(index<0 || index>=videos.length)return;

  const item=feed.querySelector(
    `.item[data-index="${index}"]`
  );

  if(!item)return;

  const video=item.querySelector("video");

  if(video.dataset.loaded==="1")return;

  load(video,index);
}


/* HAPUS VIDEO JAUH */
function unload(video,item){

  if(video===active)return;

  video.pause();

  video.removeAttribute("src");
  video.load();

  delete video.dataset.loaded;

  const loader=item.querySelector(".loading");

  if(loader){
    loader.style.display="flex";
    loader.innerHTML='<div class="spinner"></div>';
  }
}


/* ESCAPE JUDUL */
function safe(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* MUTE / UNMUTE */
feed.addEventListener("click",e=>{

  const video=e.target.closest("video");

  if(!video)return;

  video.muted=!video.muted;

});


/* KETIKA TAB KEMBALI */
document.addEventListener("visibilitychange",()=>{

  if(!document.hidden && active){
    active.play().catch(()=>{});
  }

});


/* KETIKA SELESAI SCROLL CEPAT */
let scrollTimer;

feed.addEventListener("scroll",()=>{

  clearTimeout(scrollTimer);

  scrollTimer=setTimeout(()=>{

    if(active){
      active.play().catch(()=>{});
    }

  },80);

},{passive:true});

</script></body>
</html>
