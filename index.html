<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STREAMVID</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,sans-serif}
body{overflow:hidden}

.feed{
  width:100%;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
.feed::-webkit-scrollbar{display:none}

.item{
  width:100%;
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.info{
  position:absolute;
  left:15px;
  right:70px;
  bottom:25px;
  z-index:5;
  pointer-events:none;
  text-shadow:0 1px 5px #000;
}

.title{
  font-size:15px;
  font-weight:600;
  line-height:1.4;
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  z-index:2;
}

.spinner{
  width:35px;
  height:35px;
  border:3px solid #555;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:15px;
  background:linear-gradient(#000b,transparent);
  pointer-events:none;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{color:orange}

.empty{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}
</style></head><body><div class="top">
  <div class="logo">STREAM<span>VID</span></div>
</div><div class="feed" id="feed">
  <div class="empty">Memuat video...</div>
</div><script>
let videos=[];
let activeVideo=null;
let loading=new Set();

const feed=document.getElementById("feed");

fetch("videos.json")
.then(r=>r.json())
.then(data=>{
  videos=data.reverse();
  feed.innerHTML="";
  render();
})
.catch(()=>{
  feed.innerHTML='<div class="empty">Gagal memuat video</div>';
});

function render(){
  const frag=document.createDocumentFragment();

  videos.forEach((v,i)=>{
    const item=document.createElement("div");
    item.className="item";
    item.dataset.index=i;

    item.innerHTML=`
      <div class="loading"><div class="spinner"></div></div>
      <video muted playsinline loop preload="none"></video>
      <div class="info">
        <div class="title">${escapeHTML(v.Judul||"")}</div>
      </div>
    `;

    item.onclick=()=>{
      if(activeVideo){
        activeVideo.muted=!activeVideo.muted;
        activeVideo.play().catch(()=>{});
      }
    };

    frag.appendChild(item);
  });

  feed.appendChild(frag);

  observeItems();
}

const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    const item=entry.target;
    const video=item.querySelector("video");
    const index=+item.dataset.index;

    if(entry.isIntersecting && entry.intersectionRatio>=.6){
      loadVideo(video,index);
      playVideo(video);

      // preload video berikutnya
      if(videos[index+1]){
        const next=item.nextElementSibling;
        if(next) loadVideo(next.querySelector("video"),index+1);
      }
    }else{
      video.pause();

      // Hapus source video yang jauh agar RAM tidak penuh
      if(entry.intersectionRatio===0){
        const rect=item.getBoundingClientRect();

        if(Math.abs(rect.top)>window.innerHeight*2){
          video.removeAttribute("src");
          video.load();
          video.dataset.loaded="";
        }
      }
    }
  });
},{
  threshold:[0,.6,1]
});

function observeItems(){
  document.querySelectorAll(".item").forEach(item=>{
    observer.observe(item);
  });
}

function loadVideo(video,index){
  if(video.dataset.loaded==="1" || loading.has(index)) return;

  loading.add(index);

  video.src=videos[index].Url;
  video.dataset.loaded="1";
  video.load();

  video.addEventListener("loadeddata",()=>{
    loading.delete(index);
    const box=video.parentElement.querySelector(".loading");
    if(box) box.style.display="none";
  },{once:true});
}

function playVideo(video){
  if(activeVideo && activeVideo!==video){
    activeVideo.pause();
  }

  activeVideo=video;

  video.play().catch(()=>{
    // autoplay gagal, tetap aman karena video muted
  });
}

function escapeHTML(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

// Klik sekali untuk mute/unmute
document.addEventListener("click",e=>{
  const video=e.target.closest("video");
  if(!video) return;

  video.muted=!video.muted;
});

// Pastikan video aktif setelah kembali ke tab
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && activeVideo){
    activeVideo.play().catch(()=>{});
  }
});
</script></body>
</html>
